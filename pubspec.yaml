name: mummy_guide
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  adaptive_theme: ^3.6.0
  animate_do: ^4.2.0
  animated_text_kit: ^4.2.3
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  change_app_package_name: ^1.5.0
  cupertino_icons: ^1.0.8
  dots_indicator: ^4.0.1
  flick_video_player: ^0.9.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_dotenv: ^5.2.1
  flutter_localization: ^0.3.1
  flutter_osm_plugin: ^1.3.6
  flutter_reaction_button: ^3.0.0+3
  flutter_secure_storage: ^9.2.2
  flutter_typeahead: ^5.2.0
  fluttertoast: ^8.2.10
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  launcher_name: ^1.0.2
  path: ^1.9.0
  persistent_bottom_nav_bar: ^6.2.1
  photo_view: ^0.15.0
  provider: ^6.1.2
  supabase_flutter: ^2.8.2
  swipe_refresh: ^1.1.2
  timeago: ^3.7.0
  video_player: ^2.9.5
  flutter_local_notifications: ^19.2.1
  flutter_pdfview: ^1.4.0+1
  font_awesome_flutter: ^10.8.0
  google_generative_ai: ^0.4.7
  http: ^1.3.0
  intl: ^0.19.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  workmanager: ^0.6.0
  youtube_player_flutter: ^9.1.1
  flutter_launcher_icons: ^0.13.1
  flutter_markdown: ^0.6.14




dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

launcher_name:
  default: "MummyGuide"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/2-removebg-preview (1) 1.png
    - assets/images/Specialistimages/
    - assets/books/
    - assets/images/3f6e580f6983fcb59889814757b99134a4f552b5.png
    - assets/images/
    - .env
    - assets/fonts/

  fonts:
    - family: KingsguardCalligraphy
      fonts:
        - asset: assets/fonts/KingsguardCalligraphy.otf
          weight: 700
    - family: Poppins 
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
